<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HellFess</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Carte 3D plein écran : cœur du site. Tout part de là. -->
<div id="carte-plein"></div>

<!-- Bandeau de marque, superposé en haut à gauche -->
<div id="marque">
  <div class="logo">HELL<span>FESS</span></div>
  <div class="dates">4 · 5 · 6 septembre 2026</div>
</div>

<!-- Voile assombrissant derrière le drawer -->
<div id="drawer-voile"></div>

<!-- Panneau d'analyse flottant (rempli dynamiquement par app.js) -->
<aside id="drawer" aria-hidden="true">
  <header class="drawer-tete">
    <div class="drawer-titres">
      <span class="drawer-surtitre" id="drawer-surtitre"></span>
      <h2 id="drawer-titre"></h2>
    </div>
    <button class="drawer-fermer" id="drawer-fermer" aria-label="Fermer le panneau">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>
  <div class="drawer-corps" id="drawer-corps"></div>
</aside>

<!-- ===== Gabarits des panneaux d'analyse (clonés dans le drawer à l'ouverture) ===== -->

<template id="gabarit-ensemble">
  <div class="bloc-hero">
    <p class="bloc-sur">5ᵉ édition · capacité 50 000 / jour</p>
    <p class="bloc-txt">3 scènes, 48 artistes. Un système intelligent qui prévoit l'affluence,
    détecte les incidents et réalloue les équipes.</p>
  </div>
  <h3 class="titre-bloc">Têtes d'affiche</h3>
  <div class="headliners" id="headliners"></div>
  <h3 class="titre-bloc">Le festival en chiffres</h3>
  <div class="grille-kpi" id="kpi-accueil"></div>
  <div class="carte-graph compact">
    <h3>Affluence totale du site</h3>
    <div class="graph" id="graph-affluence-totale"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Anomalies par jour</h3>
    <div class="graph" id="graph-anomalies-jour"></div>
  </div>
  <h3 class="titre-bloc">Programmation</h3>
  <div class="segments" id="seg-prog"></div>
  <div class="carte-graph">
    <div class="graph graph-haut" id="graph-gantt"></div>
  </div>
  <div class="carte-graph">
    <h3>Grille horaire</h3>
    <div class="conteneur-table" id="table-prog"></div>
  </div>
</template>

<template id="gabarit-affluence">
  <p class="bloc-txt" id="affluence-intro">Fréquentation observée par scène, issue de la
  simulation à événements discrets. Prévision opérationnelle par créneau de 30 min pour le dimanche.</p>
  <div class="segments" id="seg-affluence"></div>
  <div class="carte-graph compact">
    <div class="graph" id="graph-affluence-scenes"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Taux d'occupation</h3>
    <div class="graph" id="graph-heatmap"></div>
  </div>
  <h3 class="titre-bloc">Prévision par scène et créneau</h3>
  <div class="grille-kpi" id="kpi-previsions"></div>
  <div class="segments" id="seg-previsions"></div>
  <div class="carte-graph compact">
    <div class="graph" id="graph-previsions"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Importance des variables (permutation)</h3>
    <div class="graph" id="graph-importances"></div>
  </div>
</template>

<template id="gabarit-previsions">
  <p class="bloc-txt">Deux horizons : la fréquentation de la 5ᵉ édition estimée par la tendance
  2022-2025 et la billetterie, puis la prévision fine par scène et créneau.</p>
  <div class="carte-graph">
    <h3>Affluence par édition — la 5ᵉ année prédite</h3>
    <div class="graph" id="graph-editions"></div>
  </div>
  <div class="carte-graph">
    <h3>Billetterie en ligne — ventes à 2 mois</h3>
    <p class="sous-note">Les pré-ventes sont un signal direct de la demande : le samedi part le
    plus vite. On combine avec la tendance historique pour rattraper le samedi.</p>
    <div id="billetterie-panneau"></div>
  </div>
</template>

<template id="gabarit-anomalies">
  <p class="bloc-txt">Règles métier (surcharges, pannes, mouvements de foule) complétées par
  Isolation Forest, évaluées contre les incidents injectés dans la simulation.</p>
  <div class="grille-kpi" id="kpi-anomalies"></div>
  <div class="segments" id="seg-anomalies"></div>
  <div class="carte-graph">
    <div class="graph" id="graph-anomalies"></div>
  </div>
  <div class="carte-graph">
    <h3>Détail des anomalies</h3>
    <div class="conteneur-table" id="table-anomalies"></div>
  </div>
  <h3 class="titre-bloc">Anticipation — prévoir les surcharges avant le jour J</h3>
  <p class="sous-note">On applique la règle de surcharge sur la <b>prévision</b> du dimanche pour
  alerter à l'avance, puis on vérifie combien de ces alertes se sont réalisées.</p>
  <div class="grille-kpi" id="kpi-anticipation"></div>
  <div class="carte-graph">
    <h3>Alertes anticipées (dimanche 6 septembre)</h3>
    <div class="conteneur-table" id="table-anticipation"></div>
  </div>
</template>

<template id="gabarit-allocation">
  <p class="bloc-txt">Répartition du personnel optimisée par programmation linéaire à partir des
  prévisions, puis ré-optimisée quand des anomalies sont détectées.</p>
  <div class="grille-kpi" id="kpi-allocation"></div>
  <div class="segments" id="seg-allocation-jour"></div>
  <div class="segments" id="seg-allocation"></div>
  <div class="carte-graph compact">
    <div class="graph" id="graph-allocation"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Besoin et alloué par scène (cumul du jour)</h3>
    <div class="graph" id="graph-besoin-alloue"></div>
  </div>
  <h3 class="titre-bloc">Dimensionnement du personnel</h3>
  <p class="sous-note">Faut-il déployer 100 % de l'effectif de pointe ? On teste tous les niveaux
  et on mesure la couverture. En dessous, des créneaux restent à découvert ; au-dessus, c'est payé pour rien.</p>
  <div class="carte-graph compact">
    <h3>Couverture selon l'effectif déployé</h3>
    <div class="graph" id="graph-dimensionnement"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Effectif idéal par domaine</h3>
    <div id="dimensionnement-ideal"></div>
    <p class="sous-note" style="margin-top:14px">Effectifs à l'échelle du <b>site entier</b>,
    répartis sur toutes les installations. La carte n'affiche que des marqueurs représentatifs.</p>
  </div>
</template>

<template id="gabarit-transport">
  <p class="bloc-txt">Les navettes gèrent <b>deux flux</b> : amener le public à l'ouverture et
  évacuer la vague de départs à la clôture. On dimensionne la flotte sur la contrainte la plus dure.</p>
  <div class="carte-graph">
    <h3>Charge des navettes au fil de la soirée</h3>
    <div class="graph" id="graph-transport"></div>
  </div>
  <div class="carte-graph">
    <h3>Flotte de navettes à prévoir</h3>
    <div id="transport-resume"></div>
  </div>
  <h3 class="titre-bloc">Billetterie — état des ventes</h3>
  <div class="carte-graph">
    <div id="billetterie-panneau-t"></div>
  </div>
</template>

<template id="gabarit-scenarios">
  <p class="bloc-txt">Chaque configuration d'organisation est rejouée 3 fois par la simulation
  avec des graines différentes ; les métriques sont moyennées.</p>
  <div class="grille-kpi" id="kpi-scenarios"></div>
  <div class="carte-graph compact">
    <h3>Créneaux en surcharge</h3>
    <div class="graph" id="graph-surcharge"></div>
  </div>
  <div class="carte-graph compact">
    <h3>Coût du personnel (3 jours)</h3>
    <div class="graph" id="graph-cout"></div>
  </div>
  <div class="carte-graph">
    <h3>Couverture des besoins — 3 runs par scénario</h3>
    <div class="graph" id="graph-couverture"></div>
  </div>
  <div class="carte-graph">
    <h3>Synthèse</h3>
    <div class="conteneur-table" id="table-scenarios"></div>
  </div>
  <h3 class="titre-bloc">Recommandations</h3>
  <div id="liste-recos"></div>
</template>

<p id="credit-photos-pied">Photos têtes d'affiche : Wikimedia Commons, licences CC BY / CC BY-SA — détail dans <code>site/photos/CREDITS.md</code></p>

<script src="donnees.js"></script>
<script src="lib/echarts.min.js"></script>
<script src="lib/carte3d.js"></script>
<script src="app.js"></script>
</body>
</html>
